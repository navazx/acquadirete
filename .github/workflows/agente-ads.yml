name: Agente Ads - revisione mensile

# Il 18 di ogni mese alle 07:00 UTC legge Google Ads (ultimi 30 giorni contro i
# 30 prima) e manda su Telegram la revisione fatta: numeri, parte nascosta dei
# termini, marchi rientrati dalla porta laterale, parole sconosciute da valutare.
#
# Ha preso il posto di "Promemoria Google Ads", che diceva a Matteo di aprire il
# report a mano.
#
# NON scrive niente nel repo, di proposito: il repository e' pubblico, e spesa e
# termini di ricerca non devono finirci. E non tocca Google Ads: il service
# account (seo-report-bot, chiave in GSC_KEY_JSON) ha ruolo "Solo lettura".
on:
  schedule:
    - cron: '0 7 18 * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova: stampa la revisione senza mandarla'
        type: boolean
        default: true

jobs:
  ads:
    runs-on: ubuntu-latest
    steps:
      # Azioni agganciate allo SHA, non al tag. Vedi keyword-alert.yml.
      - name: Checkout del repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Leggi Google Ads e manda la revisione
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '6369351410'
          # Nel giro programmato inputs e' vuoto, quindi PROVA non e' "true" e il messaggio parte.
          PROVA: ${{ inputs.prova }}
        run: node scripts/agente-ads.mjs
