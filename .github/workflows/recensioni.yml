name: Recensioni - guarda se ce ne sono di nuove

# Ogni giorno alle 06:50 UTC (~08:50 ora italiana d'estate) chiede a Google le
# recensioni dell'attivita' e le confronta con quelle gia' viste. Le nuove
# finiscono in coda in agenti/recensioni/da-rispondere.json, da cui l'agente nel
# cloud prende cosa scrivere.
#
# Su Telegram parla solo quando serve davvero: una recensione da 3 stelle o meno
# (che non puo' aspettare la bozza), oppure il totale che si muove senza che
# Google ci faccia vedere la recensione. Per le altre tace: il messaggio arriva
# dopo, con la risposta pronta da incollare.
#
# Serve il secret GOOGLE_PLACES_API_KEY, creato il 12 set 2026 nel progetto
# Google Cloud acquadirete-seo e limitato alla sola Places API (New).
# Media e totale del SITO (lib/google-reviews.json) li allinea lui a quelli di
# Google, dal 4 ott 2026: quando cambiano il sito va ripubblicato. Le recensioni
# scritte per esteso nello stesso file restano a mano.
on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova: stampa cosa manderebbe senza mandarlo'
        type: boolean
        default: true

# Per ricordarsi quali recensioni ha gia' visto.
permissions:
  contents: write

jobs:
  recensioni:
    runs-on: ubuntu-latest
    steps:
      # Azioni agganciate allo SHA, non al tag. Vedi agente-seo.yml.
      - name: Checkout del repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Guarda le recensioni
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # Identificativo della scheda Google di Acquadirete: non e un segreto, e
          # fissarlo evita una chiamata di ricerca al giorno.
          GOOGLE_PLACE_ID: ChIJo-rhk09RKhMRiruMK67kuY8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '6369351410'
          # Nel giro programmato inputs e' vuoto, quindi PROVA non e' "true".
          PROVA: ${{ inputs.prova }}
        run: node scripts/agente-recensioni.mjs

      - name: Ricorda cosa ha visto
        if: ${{ inputs.prova != true }}
        run: |
          git config user.name  "agente-recensioni"
          git config user.email "noreply@acquadirete.it"
          fatto=""
          if [ -n "$(git status --porcelain agenti/recensioni/)" ]; then
            git add agenti/recensioni/
            # [skip netlify]: file di servizio, il sito non va ripubblicato.
            git commit -m "Recensioni: controllo giornaliero [skip netlify]"
            fatto=1
          fi
          # Media o totale cambiati: questo commit va per ULTIMO e SENZA
          # [skip netlify], perche' Netlify guarda solo l'ultimo commit del push.
          if [ -n "$(git status --porcelain lib/google-reviews.json)" ]; then
            git add lib/google-reviews.json
            git commit -m "Recensioni: media e totale del sito come su Google"
            fatto=1
          fi
          if [ -z "$fatto" ]; then
            echo "Nessuna novita' da registrare."
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
