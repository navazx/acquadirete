name: Cruscotto settimanale

# Ogni lunedi' alle 06:40 UTC (~08:40 ora italiana d'estate).
# Scrive una riga nella scheda "Cruscotto" del Gestionale con i numeri della
# settimana appena chiusa: e' la memoria storica su cui gli altri agenti
# decidono se la rotta va corretta. Se la riga della settimana c'e' gia',
# lo script non scrive niente (si puo' rilanciare senza fare danni).
# All'ora giusta lo fa partire la sveglia su Netlify
# (netlify/functions/sveglia-agenti.mjs): il giro programmato qui sotto resta come
# rete di sicurezza, perche' GitHub lo fa partire con ore di ritardo. Rilanciarlo
# non fa danni. Se cambi l'orario, cambialo anche la'.
on:
  schedule:
    - cron: '40 6 * * 1'
  workflow_dispatch:

# Per consegnare la nota alla bacheca (un file su main).
permissions:
  contents: write

jobs:
  cruscotto:
    runs-on: ubuntu-latest
    steps:
      # Azioni agganciate allo SHA, non al tag. Vedi agente-seo.yml.
      - name: Checkout del repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Scrivi la riga della settimana sul Gestionale
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          # Spesa Meta della settimana: stesso token in sola lettura dell'agente Ads.
          # Se manca o scade, la riga si scrive lo stesso con la spesa Meta vuota.
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
        run: node scripts/cruscotto.mjs

      # La nota per la bacheca degli agenti va su main (agenti/bacheca/in-arrivo/),
      # e chi la consegna sveglia il postino. Se non riesce lo dice nel log, ma non
      # fa fallire il giro.
      - name: Consegna le note alla bacheca
        if: ${{ always() }}
        env:
          POSTINO_TOKEN: ${{ secrets.POSTINO_TOKEN }}
        run: node scripts/bacheca-consegna.mjs
