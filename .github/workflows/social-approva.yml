name: Social - esegui la risposta

# Ogni mezz'ora fra le 06:00 e le 20:00 UTC. Se c'e' una bozza in attesa,
# legge Telegram: PUBBLICA la manda su Facebook e Instagram, SCARTA la archivia.
# Senza bozza o senza risposta non fa e non dice niente.
on:
  schedule:
    - cron: '*/30 6-20 * * *'
  workflow_dispatch:

# Serve per ricommittare la bozza segnata come pubblicata e l'ultimo messaggio
# letto: e' cosi' che il giro dopo sa di non doverci tornare sopra.
permissions:
  contents: write

jobs:
  approva:
    runs-on: ubuntu-latest
    steps:
      # Azioni agganciate allo SHA, non al tag. Vedi keyword-alert.yml.
      - name: Checkout del repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Leggi la risposta ed esegui
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '6369351410'
          META_PUBLISH_TOKEN: ${{ secrets.META_PUBLISH_TOKEN }}
        run: node scripts/social-approva.mjs

      - name: Registra nel repo cosa e' stato fatto
        run: |
          if [ -z "$(git status --porcelain agenti/)" ]; then
            echo "Niente da registrare."
            exit 0
          fi
          git config user.name  "agente-social"
          git config user.email "noreply@acquadirete.it"
          git add agenti/
          git commit -m "Social: eseguita la risposta di Matteo"
          git push
