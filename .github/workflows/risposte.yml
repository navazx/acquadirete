name: Risposte su Telegram

# Ogni mezz'ora fra le 06:00 e le 20:00 UTC legge cosa ha scritto Matteo al bot
# ed esegue: PUBBLICA / RIMANDA / SCARTA per il post social, APPROVA / RIFIUTA
# per le proposte degli agenti (articoli, correzioni SEO). Le foto mandate al
# bot finiscono fra quelle per i post social.
# E' l'unico lettore di Telegram: due si ruberebbero i messaggi a vicenda.
# Se non c'e' niente in sospeso non fa e non dice niente.
#
# Nota: GitHub i giri programmati li fa partire quando puo' — il 12 set 2026 ne
# ha fatti 5 invece di 29. Per questo c'e' la "sveglia" su Netlify
# (netlify/functions/sveglia-risposte.mjs): ogni 15 minuti guarda se Matteo ha
# scritto e, solo se si', fa partire questo workflow subito. Il cron qui sotto
# resta come rete di sicurezza, se la sveglia si rompe.
on:
  schedule:
    - cron: '*/30 6-20 * * *'
  workflow_dispatch:

# Mai due giri insieme: leggerebbero gli stessi messaggi prima che uno dei due li
# segni come letti, ed eseguirebbero due volte lo stesso ordine (un post doppio,
# un merge ripetuto). Chi arriva dopo aspetta in fila, non viene annullato.
concurrency:
  group: risposte-telegram
  cancel-in-progress: false

# Per unire a main le proposte approvate e registrare cosa e' stato fatto.
permissions:
  contents: write
  # Per CORREGGI: fa partire "Proposta - correggila" (correggi-proposta.yml).
  # Un avvio a mano (workflow_dispatch) col token di GitHub parte comunque.
  actions: write

jobs:
  risposte:
    runs-on: ubuntu-latest
    steps:
      # Azioni agganciate allo SHA, non al tag. Vedi agente-seo.yml.
      - name: Checkout del repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Identità per i commit
        run: |
          git config --global user.name  "agente-risposte"
          git config --global user.email "noreply@acquadirete.it"

      - name: Leggi le risposte ed esegui
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '6369351410'
          META_PUBLISH_TOKEN: ${{ secrets.META_PUBLISH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/risposte.mjs

      # Le foto mandate al bot sono appena finite in public/assets/social/. Vanno
      # messe in riga qui: il push qui sotto e' fatto col token di GitHub Actions,
      # che non fa partire altri workflow, quindi "Social - metti in riga le foto"
      # non scatterebbe.
      - name: Metti in riga le foto arrivate su Telegram
        run: |
          if [ -z "$(git status --porcelain public/assets/social/)" ]; then
            echo "Nessuna foto nuova."
            exit 0
          fi
          npm ci --no-audit --no-fund
          node scripts/normalizza-foto.mjs

      - name: Registra nel repo cosa è stato fatto
        run: |
          fatto=""
          if [ -n "$(git status --porcelain agenti/)" ]; then
            git add agenti/
            # [skip netlify]: sono file di servizio, il sito non va ripubblicato.
            # Le proposte approvate sono gia' state spinte a parte, senza la sigla.
            git commit -m "Telegram: eseguite le risposte di Matteo [skip netlify]"
            fatto=1
          fi
          # Le foto per ULTIME e SENZA [skip netlify]: Netlify guarda solo l'ultimo
          # commit del push, e le foto devono andare online, perche' Instagram le
          # scarica dal sito.
          if [ -n "$(git status --porcelain public/assets/social/)" ]; then
            git add public/assets/social/
            git commit -m "Social: foto nuove arrivate su Telegram"
            fatto=1
          fi
          if [ -z "$fatto" ]; then
            echo "Niente da registrare."
            exit 0
          fi
          git pull --rebase origin main
          git push origin HEAD:main
