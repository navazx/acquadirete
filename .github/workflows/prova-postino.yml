name: Prova del postino veloce (da togliere)

# Prova una volta sola che POSTINO_TOKEN svegli subito il postino: lascia una
# nota di prova e la consegna come fanno gli agenti. Poi questo file si toglie.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Lascia la nota di prova
        run: |
          node --input-type=module -e "import { lasciaNota } from './scripts/lib/bacheca.mjs'; lasciaNota('direttore', 'Prova del postino veloce: da oggi le note degli agenti arrivano sulla bacheca pochi minuti dopo, non più entro 3 ore.', ['matteo']);"
      - name: Consegna le note alla bacheca
        env:
          POSTINO_TOKEN: ${{ secrets.POSTINO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bacheca-consegna.mjs
