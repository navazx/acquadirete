name: Alert keyword

# Ogni lunedì alle 07:38 UTC (~09:38 ora italiana d'estate).
# workflow_dispatch permette di lanciarlo a mano dalla tab "Actions" per test.
on:
  schedule:
    - cron: '38 7 * * 1'
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      # Le azioni sono agganciate allo SHA del commit, non al tag "v4".
      # Un tag si puo' spostare: se quello di un'azione molto diffusa venisse
      # dirottato, il codice ostile girerebbe qui dentro, dove GSC_KEY_JSON e
      # TELEGRAM_BOT_TOKEN sono nell'ambiente, e se li porterebbe via.
      # Lo SHA no. Per aggiornare: prendere il nuovo SHA del tag e sostituirlo,
      # lasciando il commento con la versione leggibile.
      - name: Checkout del repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Controlla i movimenti delle keyword e avvisa su Telegram
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # chat_id non è segreto (inutile senza il token): valore diretto.
          TELEGRAM_CHAT_ID: '6369351410'
        run: node scripts/keyword-alert.mjs
